<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioWecker</title>
    <link rel="stylesheet" href="/common.css" />
    <style>
      body {
        display: grid;
        place-items: center;
      }

      .card {
        padding: 24px;
        text-align: center;
        width: min(90vw, 360px);
      }

      a {
        color: #7ecbff;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>RadioWecker</h1>
      <p><a href="/config">General Configuration</a></p>
      <p><a href="/alarm">Alarms</a></p>
      <p><a href="/status">Device Status</a></p>
      <p><a id="ftpLink" href="#">FTP (open with device host)</a></p>
    </main>

    <script>
      const ftpLinkEl = document.getElementById("ftpLink");
      if (ftpLinkEl) {
        ftpLinkEl.href = "ftp://" + window.location.hostname;
      }
    </script>
  </body>
</html>
