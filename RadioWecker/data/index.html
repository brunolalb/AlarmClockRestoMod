<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioWecker</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at 15% 15%, #1f2636 0, transparent 35%),
          radial-gradient(circle at 85% 0%, #2a1e2f 0, transparent 32%),
          linear-gradient(160deg, #10131a 0%, #0b0d12 100%);
        color: #e9edf7;
      }

      .card {
        background: #161b24;
        border: 1px solid #2a3140;
        border-radius: 10px;
        padding: 24px;
        text-align: center;
        width: min(90vw, 360px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      a {
        color: #7ecbff;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>RadioWecker</h1>
      <p><a href="/config">Open General Configuration</a></p>
      <p><a href="/alarm">Open Alarm Configuration</a></p>
    </main>
  </body>
</html>
