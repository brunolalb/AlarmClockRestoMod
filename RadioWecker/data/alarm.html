<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadioWecker Multi Alarm Setup</title>
    <link rel="stylesheet" href="/common.css" />
    <style>
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(220px, 0.8fr) minmax(0, 1.6fr);
        gap: 14px;
        align-items: start;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .day {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 4px;
        text-align: center;
        background: #131924;
        cursor: pointer;
      }

      .day input {
        display: block;
        margin: 0 auto 6px;
      }

      .check-field {
        display: flex;
        gap: 9px;
        align-items: center;
        min-height: 42px;
      }

      .hidden {
        display: none;
      }

      .alarm-list-panel h2,
      .editor-panel h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .alarm-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .alarm-item {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #131924;
        overflow: hidden;
      }

      .alarm-select {
        width: 100%;
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .alarm-item.active {
        border-color: var(--accent-dark);
        background: #211c19;
      }

      .alarm-select:hover {
        filter: brightness(1.12);
      }

      .alarm-meta {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        margin-top: 4px;
      }

      .empty-list {
        padding: 10px 0;
        color: var(--muted);
      }

      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }

      fieldset:disabled {
        opacity: 0.55;
      }

      input[type="checkbox"] {
        accent-color: var(--accent);
      }

      @media (max-width: 640px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .days {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <h1>Alarm Config</h1>
        <p>Manage up to 10 weekday alarms and their sound settings.</p>
        <a class="home-btn" href="/">Back to Home</a>
      </section>

      <div class="layout">
        <section class="card alarm-list-panel" aria-labelledby="alarmsHeading">
          <h2 id="alarmsHeading">Alarms <span id="alarmCount" class="alarm-meta"></span></h2>
          <div class="toolbar">
            <button id="addAlarmBtn" type="button">Add Alarm</button>
            <button id="removeAlarmBtn" class="danger" type="button">Remove</button>
          </div>
          <ul id="alarmList" class="alarm-list" aria-label="Saved alarms"></ul>
        </section>

        <form id="alarmForm" class="card editor-panel" autocomplete="off">
          <h2 id="editorHeading">Alarm details</h2>
          <fieldset id="alarmFields" disabled>
            <div class="grid">
              <div class="field check-field">
                <input id="enabled" name="enabled" type="checkbox" />
                <label for="enabled">Alarm enabled</label>
              </div>

              <div class="field">
                <label for="time">Time</label>
                <input id="time" name="time" type="time" required />
              </div>

              <div class="field">
                <label for="snoozeMin">Snooze (minutes)</label>
                <input id="snoozeMin" name="snoozeMin" type="number" min="0" max="255" step="1" required />
              </div>

              <div class="field full">
                <label>Days of week</label>
                <div class="days">
                  <label class="day"><input type="checkbox" data-day="0" />Mon</label>
                  <label class="day"><input type="checkbox" data-day="1" />Tue</label>
                  <label class="day"><input type="checkbox" data-day="2" />Wed</label>
                  <label class="day"><input type="checkbox" data-day="3" />Thu</label>
                  <label class="day"><input type="checkbox" data-day="4" />Fri</label>
                  <label class="day"><input type="checkbox" data-day="5" />Sat</label>
                  <label class="day"><input type="checkbox" data-day="6" />Sun</label>
                </div>
              </div>

              <div class="field check-field full">
                <input id="soundInSd" name="sound_in_SD" type="checkbox" />
                <label for="soundInSd">Load sound from SD card</label>
              </div>

              <div class="field full">
                <label for="soundPath">Sound path</label>
                <input id="soundPath" name="soundPath" type="text" maxlength="255" required placeholder="/music/alarm.mp3" />
              </div>

              <div class="field full">
                <label for="musicFiles">SD card music files</label>
                <select id="musicFiles" name="musicFiles">
                  <option value="">Choose a file to fill the sound path</option>
                </select>
              </div>

              <div class="field">
                <label for="soundStartAt">Start offset (seconds)</label>
                <input id="soundStartAt" name="soundStartAt" type="number" min="0" max="65535" step="1" required />
              </div>

              <div class="field">
                <label for="soundVolume">Sound volume</label>
                <input id="soundVolume" name="soundVolume" type="number" min="0" max="65535" step="1" required />
              </div>
            </div>
          </fieldset>

          <div class="actions">
            <button id="applyBtn" type="submit">Apply changes</button>
            <button id="saveAllBtn" class="secondary" type="button">Save all</button>
            <span id="status" class="status" role="status" aria-live="polite">Loading alarms...</span>
          </div>
        </form>
      </div>
    </main>

    <script>
      const form = document.getElementById("alarmForm");
      const alarmListEl = document.getElementById("alarmList");
      const alarmCountEl = document.getElementById("alarmCount");
      const addAlarmBtn = document.getElementById("addAlarmBtn");
      const removeAlarmBtn = document.getElementById("removeAlarmBtn");
      const saveAllBtn = document.getElementById("saveAllBtn");
      const statusEl = document.getElementById("status");
      const fieldsEl = document.getElementById("alarmFields");
      const musicFilesEl = document.getElementById("musicFiles");
      const soundPathEl = document.getElementById("soundPath");
      const dayChecks = Array.from(document.querySelectorAll("[data-day]"));
      let alarms = [];
      let selectedAlarmIndex = -1;
      let maxAlarms = 10;

      function setStatus(text, type) {
        statusEl.textContent = text;
        statusEl.className = "status" + (type ? " " + type : "");
      }

      function defaultAlarm() {
        return {
          enabled: true,
          enabled_days: [true, true, true, true, true, false, false],
          time_hour: 7,
          time_min: 0,
          snooze_min: 10,
          sound_in_SD: true,
          soundPath: "",
          soundStartAt: 0,
          soundVolume: 5,
        };
      }

      function shortDays(days) {
        const labels = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
        const active = labels.filter((_, i) => Boolean(days?.[i]));
        return active.length ? active.join(" ") : "No days";
      }

      function formattedTime(alarm) {
        const hour = String(Number(alarm.time_hour) || 0).padStart(2, "0");
        const minute = String(Number(alarm.time_min) || 0).padStart(2, "0");
        return hour + ":" + minute;
      }

      function renderAlarmList() {
        alarmListEl.innerHTML = "";
        alarmCountEl.textContent = alarms.length + "/" + maxAlarms;

        alarms.forEach((alarm, index) => {
          const li = document.createElement("li");
          li.className = "alarm-item" + (index === selectedAlarmIndex ? " active" : "");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "alarm-select";
          button.setAttribute("aria-pressed", String(index === selectedAlarmIndex));

          const content = document.createElement("span");
          const title = document.createElement("strong");
          title.textContent = formattedTime(alarm);
          const meta = document.createElement("span");
          meta.className = "alarm-meta";
          meta.textContent = (alarm.enabled ? "Enabled" : "Disabled") + " · " + shortDays(alarm.enabled_days);
          content.append(title, document.createElement("br"), meta);

          const number = document.createElement("span");
          number.textContent = "#" + (index + 1);
          button.append(content, number);
          button.addEventListener("click", () => {
            selectedAlarmIndex = index;
            loadSelectedAlarmIntoForm();
            renderAlarmList();
          });
          li.appendChild(button);
          alarmListEl.appendChild(li);
        });

        if (alarms.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-list";
          empty.textContent = "No alarms configured";
          alarmListEl.appendChild(empty);
        }

        removeAlarmBtn.disabled = selectedAlarmIndex < 0;
        addAlarmBtn.disabled = alarms.length >= maxAlarms;
      }

      function loadSelectedAlarmIntoForm() {
        if (selectedAlarmIndex < 0 || !alarms[selectedAlarmIndex]) {
          fieldsEl.disabled = true;
          document.getElementById("editorHeading").textContent = "Alarm details";
          return;
        }

        fieldsEl.disabled = false;
        const alarm = alarms[selectedAlarmIndex];
        document.getElementById("editorHeading").textContent = "Alarm " + (selectedAlarmIndex + 1);
        document.getElementById("enabled").checked = Boolean(alarm.enabled);
        document.getElementById("time").value = formattedTime(alarm);
        document.getElementById("snoozeMin").value = alarm.snooze_min ?? 10;
        document.getElementById("soundInSd").checked = Boolean(alarm.sound_in_SD);
        soundPathEl.value = alarm.soundPath || "";
        document.getElementById("soundStartAt").value = alarm.soundStartAt ?? 0;
        document.getElementById("soundVolume").value = alarm.soundVolume ?? 5;

        dayChecks.forEach((checkbox) => {
          const idx = Number(checkbox.dataset.day);
          checkbox.checked = Boolean(alarm.enabled_days?.[idx]);
        });
      }

      function collectAlarmFromForm() {
        const timeValue = document.getElementById("time").value;
        if (!timeValue) {
          throw new Error("Enter an alarm time");
        }

        const [timeHour, timeMin] = timeValue.split(":").map(Number);
        const enabled = document.getElementById("enabled").checked;
        const enabledDays = dayChecks.map((checkbox) => checkbox.checked);
        if (enabled && !enabledDays.some(Boolean)) {
          throw new Error("Select at least one day");
        }

        const snoozeMin = Number(document.getElementById("snoozeMin").value);
        const soundStartAt = Number(document.getElementById("soundStartAt").value);
        const soundVolume = Number(document.getElementById("soundVolume").value);
        if (!Number.isInteger(snoozeMin) || snoozeMin < 0 || snoozeMin > 255) {
          throw new Error("Snooze must be between 0 and 255 minutes");
        }
        if (!Number.isInteger(soundStartAt) || soundStartAt < 0 || soundStartAt > 65535) {
          throw new Error("Start offset must be between 0 and 65535 seconds");
        }
        if (!Number.isInteger(soundVolume) || soundVolume < 0 || soundVolume > 65535) {
          throw new Error("Sound volume must be between 0 and 65535");
        }

        const soundPath = soundPathEl.value.trim();
        if (!soundPath) {
          throw new Error("Sound path is required");
        }

        return {
          enabled,
          enabled_days: enabledDays,
          time_hour: timeHour,
          time_min: timeMin,
          snooze_min: snoozeMin,
          sound_in_SD: document.getElementById("soundInSd").checked,
          soundPath,
          soundStartAt,
          soundVolume,
        };
      }

      async function loadMusicFiles() {
        try {
          const response = await fetch("/api/sdcard/listMusicFiles", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("SD card unavailable");
          }
          const payload = await response.json();
          const files = Array.isArray(payload.files) ? payload.files : [];
          files.forEach((file) => {
            if (!file.path) return;
            const option = document.createElement("option");
            option.value = file.path;
            option.textContent = file.name || file.path;
            musicFilesEl.appendChild(option);
          });
          if (files.length === 0) musicFilesEl.options[0].textContent = "No SD music files found";
        } catch (err) {
          musicFilesEl.options[0].textContent = "SD music list unavailable";
        }
      }

      async function loadAlarms() {
        try {
          const response = await fetch("/api/alarm", { cache: "no-store" });
          if (!response.ok) throw new Error("Alarm API unavailable");
          const payload = await response.json();
          alarms = Array.isArray(payload.alarms) ? payload.alarms : [];
          maxAlarms = Number(payload.maxAlarms || 10);
          selectedAlarmIndex = alarms.length ? 0 : -1;
          renderAlarmList();
          loadSelectedAlarmIntoForm();

          setStatus("Loaded alarms", "ok");
        } catch (err) {
          alarms = [];
          selectedAlarmIndex = -1;
          renderAlarmList();
          loadSelectedAlarmIntoForm();
          setStatus("Could not load alarms", "err");
        }
      }

      musicFilesEl.addEventListener("change", () => {
        if (musicFilesEl.value) soundPathEl.value = musicFilesEl.value;
      });

      addAlarmBtn.addEventListener("click", () => {
        if (alarms.length >= maxAlarms) {
          setStatus("Max alarms reached (" + maxAlarms + ")", "err");
          return;
        }

        alarms.push(defaultAlarm());
        selectedAlarmIndex = alarms.length - 1;
        renderAlarmList();
        loadSelectedAlarmIntoForm();
        setStatus("Alarm added locally", "ok");
      });

      removeAlarmBtn.addEventListener("click", () => {
        if (selectedAlarmIndex < 0) {
          return;
        }

        alarms.splice(selectedAlarmIndex, 1);
        selectedAlarmIndex = alarms.length ? Math.min(selectedAlarmIndex, alarms.length - 1) : -1;
        renderAlarmList();
        loadSelectedAlarmIntoForm();
        setStatus("Alarm removed locally", "ok");
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (selectedAlarmIndex < 0 || !alarms[selectedAlarmIndex]) {
          setStatus("No alarm selected", "err");
          return;
        }

        try {
          alarms[selectedAlarmIndex] = collectAlarmFromForm();
          renderAlarmList();
          setStatus("Alarm updated locally", "ok");
        } catch (err) {
          setStatus("Error: " + err.message, "err");
        }
      });

      saveAllBtn.addEventListener("click", async () => {
        try {
          if (selectedAlarmIndex >= 0 && alarms[selectedAlarmIndex]) {
            alarms[selectedAlarmIndex] = collectAlarmFromForm();
          }

          setStatus("Saving all alarms...", "");

          const response = await fetch("/api/alarm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ alarms }),
          });

          const payload = await response.json();
          if (!payload.ok) {
            throw new Error(payload.error || "Save failed");
          }

          setStatus("Saved " + payload.count + " alarms", "ok");
          alarms = (await (await fetch("/api/alarm", { cache: "no-store" })).json()).alarms || alarms;
          renderAlarmList();
          loadSelectedAlarmIntoForm();
        } catch (err) {
          setStatus("Error: " + err.message, "err");
        }
      });

      loadMusicFiles();
      loadAlarms();
    </script>
  </body>
</html>
